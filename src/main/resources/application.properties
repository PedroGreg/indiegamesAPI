spring.application.name=API indie games
# Altera o título da página na aba do navegador
springdoc.swagger-ui.title=Indie Games API - Documentação

# Esconde a seção de Schemas/Modelos no rodapé da página
springdoc.swagger-ui.default-models-expand-depth=-1

# Ordena os endpoints por method HTTP ou por caminho alfabético (alpha)
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Mantém os métodos/tags recolhidos por padrão ao abrir a página ('none' ou 'list')
springdoc.swagger-ui.doc-expansion=none

# Exibe o tempo de resposta das requisições na interface
springdoc.swagger-ui.display-request-duration=true

springdoc.swagger-ui.custom-css=/swagger-custom.css