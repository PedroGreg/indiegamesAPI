spring.application.name=IndieGamesApi

# NOVO: banco H2 em memória (os dados somem ao reiniciar)
spring.datasource.url=jdbc:h2:mem:indiegames
spring.datasource.username=sa
spring.datasource.password=
# create-drop: o Hibernate cria as tabelas a partir das entidades ao subir e apaga ao desligar
spring.jpa.hibernate.ddl-auto=create-drop
# Mantém a sessão do banco aberta até o fim da requisição (os assemblers leem relações LAZY, como game.getDeveloper())
spring.jpa.open-in-view=true
# Console do H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:indiegames, usuário: sa, sem senha)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# NOVO: front-ends que podem chamar a API pelo navegador (CORS), separados por vírgula
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

# NOVO: cria dados de exemplo e o usuário admin@indiegames.com / admin123 ao subir (DataSeeder). false = banco vazio.
app.seed.enabled=true
