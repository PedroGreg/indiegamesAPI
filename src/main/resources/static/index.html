<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indie Games API - Dashboard Cyberpunk</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050508;
            --bg-card: #0d0e15;
            --bg-card-hover: #131522;
            --panel-bg: rgba(13, 14, 21, 0.85);
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --neon-purple: #9d4edd;
            --neon-green: #00ff66;
            --neon-yellow: #ffcc00;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-glow: rgba(0, 243, 255, 0.25);
            --border-magenta: rgba(255, 0, 85, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            background-image:
                    radial-gradient(circle at 15% 15%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
                    radial-gradient(circle at 85% 85%, rgba(255, 0, 85, 0.05) 0%, transparent 40%),
                    linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            padding: 24px;
        }

        /* --- Scanline Effect --- */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.6;
        }

        .container {
            max-width: 1350px;
            margin: 0 auto;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 20px var(--border-glow), inset 0 0 15px rgba(0, 243, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 30px;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            font-size: 2rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .brand-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .brand-title p {
            font-size: 0.85rem;
            color: var(--neon-cyan);
            letter-spacing: 1px;
            font-family: 'Fira Code', monospace;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--neon-green);
            padding: 6px 16px;
            border-radius: 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* --- Toolbar --- */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 10px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .tab-btn:hover, .tab-btn.active {
            color: #fff;
            border-color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 12px var(--border-glow);
        }

        .action-btns {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--neon-purple);
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            text-decoration: none;
        }

        .btn-primary {
            border-color: var(--neon-magenta);
            background: rgba(255, 0, 85, 0.15);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--neon-magenta);
            box-shadow: 0 0 15px var(--neon-magenta);
        }

        .btn:hover {
            border-color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* --- Cards Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 22px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            padding: 22px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .card:hover {
            transform: translateY(-4px);
            background: var(--bg-card-hover);
            border-color: var(--neon-cyan);
            box-shadow: 0 8px 25px rgba(0, 243, 255, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
        }

        .status-tag {
            font-family: 'Fira Code', monospace;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-RELEASED {
            background: rgba(0, 255, 102, 0.15);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .status-EARLY_ACCESS {
            background: rgba(255, 204, 0, 0.15);
            color: var(--neon-yellow);
            border: 1px solid var(--neon-yellow);
        }

        .status-DEVELOPMENT {
            background: rgba(255, 0, 85, 0.15);
            color: var(--neon-magenta);
            border: 1px solid var(--neon-magenta);
        }

        .card-body p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .card-body strong {
            color: var(--text-main);
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--neon-cyan);
            padding: 3px 8px;
            font-size: 0.75rem;
            font-family: 'Fira Code', monospace;
            border-radius: 2px;
        }

        /* --- Modal Cyberpunk --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 30px var(--border-glow);
            padding: 30px;
            width: 100%;
            max-width: 520px;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
        }

        .modal h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            font-size: 1.3rem;
            margin-bottom: 20px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
            text-transform: uppercase;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: var(--bg-deep);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1rem;
            border-radius: 2px;
            transition: border-color 0.2s ease;
        }

        .form-group select[multiple] {
            height: 100px;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--border-glow);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
        }

        /* --- Console / JSON Drawer --- */
        .console-panel {
            margin-top: 35px;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 15px 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
        }

        .console-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            margin-bottom: 10px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 6px;
        }

        .console-log {
            color: var(--neon-green);
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .nav-tabs { flex-wrap: wrap; }
        .tab-count {
            margin-left: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: var(--neon-cyan);
        }
        .status-badge.offline {
            background: rgba(255, 0, 85, 0.1);
            border-color: var(--neon-magenta);
            color: var(--neon-magenta);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
        }
        .status-badge.offline .status-dot {
            background-color: var(--neon-magenta);
            box-shadow: 0 0 8px var(--neon-magenta);
        }
        .search-box {
            flex: 1;
            min-width: 220px;
            max-width: 360px;
            padding: 10px 14px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1rem;
            border-radius: 2px;
        }
        .search-box:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--border-glow);
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .btn-delete {
            background: transparent;
            border: 1px solid rgba(255, 0, 85, 0.4);
            color: var(--neon-magenta);
            padding: 4px 10px;
            font-family: 'Fira Code', monospace;
            font-size: 0.7rem;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.2s ease;
        }
        .btn-delete:hover {
            background: var(--neon-magenta);
            color: #fff;
            box-shadow: 0 0 10px var(--neon-magenta);
        }
        .state-msg {
            grid-column: 1 / -1;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
            padding: 30px 0;
        }
        .state-msg.error { color: var(--neon-magenta); }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 25px;
            font-family: 'Fira Code', monospace;
            color: var(--text-muted);
        }
        .pagination .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            box-shadow: none;
        }
        .form-error {
            color: var(--neon-magenta);
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            margin-top: 10px;
            min-height: 1em;
        }
        @media (max-width: 640px) {
            body { padding: 16px; }
            header { flex-direction: column; gap: 14px; align-items: flex-start; }
            .grid { grid-template-columns: 1fr; }
            .action-btns { flex-wrap: wrap; }
            .btn { padding: 8px 14px; font-size: 0.85rem; }
            .search-box { max-width: none; }
            .console-header { flex-direction: column; gap: 4px; word-break: break-all; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <header>
        <div class="brand">
            <div class="brand-logo">🎮</div>
            <div class="brand-title">
                <h1>INDIE GAMES API</h1>
                <p>// CYBERPUNK MANAGEMENT DASHBOARD v1.0</p>
            </div>
        </div>
        <div class="status-badge" id="apiStatus">
            <div class="status-dot"></div>
            <span id="apiStatusText">CONECTANDO...</span>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="nav-tabs" id="navTabs">
            <button class="tab-btn active" data-tab="game">JOGOS<span class="tab-count" id="count-game"></span></button>
            <button class="tab-btn" data-tab="developer">DESENVOLVEDORES<span class="tab-count" id="count-developer"></span></button>
            <button class="tab-btn" data-tab="category">CATEGORIAS<span class="tab-count" id="count-category"></span></button>
            <button class="tab-btn" data-tab="platform">PLATAFORMAS<span class="tab-count" id="count-platform"></span></button>
        </div>
        <input type="search" id="searchInput" class="search-box" placeholder="Buscar por nome...">
        <div class="action-btns">
            <button class="btn btn-primary" onclick="openModal()">+ CADASTRAR</button>
            <button class="btn" onclick="loadCurrentTab()">🔄 ATUALIZAR</button>
            <a href="/swagger-ui/index.html" target="_blank" class="btn">📖 SWAGGER</a>
        </div>
    </div>

    <!-- Cards Grid -->
    <div id="cardsGrid" class="grid"></div>

    <!-- Paginação (usa o metadata "page" do PagedModel) -->
    <div id="pagination" class="pagination" style="display:none">
        <button class="btn" id="prevPage">◀ ANTERIOR</button>
        <span id="pageInfo"></span>
        <button class="btn" id="nextPage">PRÓXIMA ▶</button>
    </div>

    <!-- Terminal Console Log -->
    <div class="console-panel">
        <div class="console-header">
            <span>> TERMINAL_LOG :: SPRING_BOOT_RESPONSE</span>
            <span id="httpStatus">--</span>
        </div>
        <div id="consoleOutput" class="console-log">Aguardando requisição HTTP...</div>
    </div>
</div>

<!-- Modal de cadastro (POST) -->
<div id="modalOverlay" class="modal-overlay">
    <div class="modal">
        <h2 id="modalTitle">Cadastrar</h2>
        <form id="postForm">
            <div id="dynamicFormFields"></div>
            <div id="formError" class="form-error"></div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="closeModal()">CANCELAR</button>
                <button type="submit" class="btn btn-primary" id="submitBtn">ENVIAR (POST)</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Servido pelo próprio Spring Boot -> mesma origem ("/api").
    // Se abrir o arquivo direto do disco (file://), aponta para o localhost:8080.
    const API_BASE_URL = window.location.protocol === 'file:' ? 'http://localhost:8080/api' : '/api';
    const PAGE_SIZE = 9;

    const TABS = {
        game:      { label: 'JOGO',          render: renderGameCard },
        developer: { label: 'DESENVOLVEDOR', render: renderSimpleCard },
        category:  { label: 'CATEGORIA',     render: renderSimpleCard },
        platform:  { label: 'PLATAFORMA',    render: renderSimpleCard }
    };

    let currentTab = 'game';
    let currentPage = 0;
    let searchTerm = '';

    // ---------- Helpers ----------

    // Evita injeção de HTML com nomes vindos do banco
    function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
        ));
    }

    function formatDate(iso) {
        if (!iso) return '--';
        const d = new Date(iso);
        return isNaN(d) ? iso : d.toLocaleDateString('pt-BR');
    }

    // Extrai a lista do PagedModel HAL. Quando a página está vazia,
    // o Spring HATEOAS omite "_embedded", por isso o fallback para [].
    function extractItems(data) {
        if (data && data._embedded) {
            const lists = Object.values(data._embedded);
            return Array.isArray(lists[0]) ? lists[0] : [];
        }
        if (Array.isArray(data)) return data;
        return (data && data.content) || [];
    }

    function logResponse(method, url, status, body) {
        const ok = status >= 200 && status < 300;
        const httpEl = document.getElementById('httpStatus');
        httpEl.innerText = `${method} ${url} → HTTP ${status}`;
        httpEl.style.color = ok ? 'var(--neon-green)' : 'var(--neon-magenta)';
        const out = document.getElementById('consoleOutput');
        out.style.color = ok ? 'var(--neon-green)' : 'var(--neon-magenta)';
        out.innerText = body === undefined ? '(sem corpo)' : JSON.stringify(body, null, 2);
    }

    // fetch + parse JSON + log no terminal. Lança erro com a mensagem da API.
    async function api(path, options = {}) {
        const method = options.method || 'GET';
        const res = await fetch(`${API_BASE_URL}${path}`, {
            ...options,
            headers: { 'Accept': 'application/hal+json, application/json', ...(options.body ? { 'Content-Type': 'application/json' } : {}) }
        });
        let body;
        const text = await res.text();
        if (text) {
            try { body = JSON.parse(text); } catch { body = text; }
        }
        logResponse(method, `/api${path}`, res.status, body);
        if (!res.ok) {
            // NotFound/BadRequest -> {message}; validação do Spring -> ProblemDetail {detail}
            const msg = (body && (body.message || body.detail || body.title)) || `HTTP ${res.status}`;
            const err = new Error(msg);
            err.status = res.status;
            throw err;
        }
        return body;
    }

    function setApiStatus(online) {
        const badge = document.getElementById('apiStatus');
        badge.classList.toggle('offline', !online);
        document.getElementById('apiStatusText').innerText = online
            ? `ONLINE :: ${window.location.host || 'localhost:8080'}`
            : 'OFFLINE :: SEM RESPOSTA DA API';
    }

    // ---------- Navegação ----------

    document.getElementById('navTabs').addEventListener('click', (e) => {
        const btn = e.target.closest('.tab-btn');
        if (!btn) return;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        currentPage = 0;
        searchTerm = '';
        document.getElementById('searchInput').value = '';
        loadCurrentTab();
    });

    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            searchTerm = e.target.value.trim();
            currentPage = 0;
            loadCurrentTab();
        }, 300);
    });

    document.getElementById('prevPage').addEventListener('click', () => { currentPage--; loadCurrentTab(); });
    document.getElementById('nextPage').addEventListener('click', () => { currentPage++; loadCurrentTab(); });

    // ---------- Listagem ----------

    async function loadCurrentTab() {
        const grid = document.getElementById('cardsGrid');
        grid.innerHTML = '<p class="state-msg">Carregando dados do H2...</p>';

        const params = new URLSearchParams({ page: currentPage, size: PAGE_SIZE, sort: 'id,asc' });
        let path = `/${currentTab}`;
        if (searchTerm) {
            path += '/search';
            params.set('name', searchTerm);
        }

        try {
            const data = await api(`${path}?${params}`);
            setApiStatus(true);
            const items = extractItems(data);
            const page = data.page || { number: 0, totalPages: 1, totalElements: items.length };

            if (!searchTerm) {
                document.getElementById(`count-${currentTab}`).innerText = `[${page.totalElements}]`;
            }

            renderPagination(page);

            if (items.length === 0) {
                grid.innerHTML = `<p class="state-msg">${searchTerm
                    ? `Nenhum resultado para "${esc(searchTerm)}".`
                    : 'Nenhum registro cadastrado ainda. Use + CADASTRAR.'}</p>`;
                return;
            }

            grid.innerHTML = items.map(item => TABS[currentTab].render(item)).join('');
        } catch (error) {
            console.error(error);
            if (!error.status) setApiStatus(false);
            document.getElementById('pagination').style.display = 'none';
            grid.innerHTML = `<p class="state-msg error">Erro ao carregar dados: ${esc(error.message)}</p>`;
        }
    }

    function renderPagination(page) {
        const pag = document.getElementById('pagination');
        if (!page || page.totalPages <= 1) {
            pag.style.display = 'none';
            return;
        }
        pag.style.display = 'flex';
        document.getElementById('pageInfo').innerText = `PÁGINA ${page.number + 1} / ${page.totalPages}`;
        document.getElementById('prevPage').disabled = page.number <= 0;
        document.getElementById('nextPage').disabled = page.number >= page.totalPages - 1;
    }

    function cardFooter(item) {
        return `
            <div class="card-footer">
                <span>ID ${esc(item.id)} · criado em ${formatDate(item.createdAt)}</span>
                <button class="btn-delete" data-id="${Number(item.id)}" data-name="${esc(item.name)}">DELETAR</button>
            </div>`;
    }

    function renderGameCard(game) {
        const devName = game.developer ? game.developer.name : 'N/A';
        const catName = game.category ? game.category.name : 'N/A';
        const platforms = (game.platforms || []).map(p => `<span class="chip">${esc(p.name)}</span>`).join('');
        return `
            <div class="card">
                <div>
                    <div class="card-header">
                        <div class="card-title">${esc(game.name)}</div>
                        <span class="status-tag status-${esc(game.status)}">${esc(game.status)}</span>
                    </div>
                    <div class="card-body">
                        <p><strong>Desenvolvedor:</strong> ${esc(devName)}</p>
                        <p><strong>Categoria:</strong> ${esc(catName)}</p>
                        <div class="tag-list">${platforms}</div>
                    </div>
                </div>
                ${cardFooter(game)}
            </div>`;
    }

    function renderSimpleCard(item) {
        return `
            <div class="card">
                <div class="card-header">
                    <div class="card-title">${esc(item.name)}</div>
                </div>
                ${cardFooter(item)}
            </div>`;
    }

    // ---------- Exclusão ----------

    document.getElementById('cardsGrid').addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-delete');
        if (btn) deleteItem(Number(btn.dataset.id), btn.dataset.name);
    });

    async function deleteItem(id, name) {
        if (!confirm(`Deletar "${name}" (ID ${id})?`)) return;
        try {
            await api(`/${currentTab}/${id}`, { method: 'DELETE' });
            loadCurrentTab();
        } catch (err) {
            // Ex.: deletar um desenvolvedor que ainda tem jogos (sem DELETE CASCADE)
            const grid = document.getElementById('cardsGrid');
            grid.insertAdjacentHTML('afterbegin',
                `<p class="state-msg error">Não foi possível deletar: ${esc(err.message)}. Verifique se há jogos vinculados.</p>`);
        }
    }

    // ---------- Cadastro ----------

    // Busca todos os registros de uma entidade (para popular os selects do formulário)
    async function fetchAll(entity) {
        const data = await api(`/${entity}?size=1000&sort=name,asc`);
        return extractItems(data);
    }

    async function openModal() {
        const fields = document.getElementById('dynamicFormFields');
        document.getElementById('formError').innerText = '';
        document.getElementById('modalTitle').innerText = `CADASTRAR ${TABS[currentTab].label}`;
        document.getElementById('modalOverlay').style.display = 'flex';

        if (currentTab !== 'game') {
            fields.innerHTML = `
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="simpleName" required minlength="3" maxlength="255" placeholder="Digite o nome...">
                </div>`;
            document.getElementById('simpleName').focus();
            return;
        }

        fields.innerHTML = '<p class="state-msg">Carregando desenvolvedores, categorias e plataformas...</p>';
        try {
            const [devs, cats, plats] = await Promise.all([
                fetchAll('developer'), fetchAll('category'), fetchAll('platform')
            ]);

            const missing = [
                !devs.length && 'desenvolvedor',
                !cats.length && 'categoria',
                !plats.length && 'plataforma'
            ].filter(Boolean);
            if (missing.length) {
                fields.innerHTML = `<p class="state-msg error">Cadastre antes pelo menos um(a): ${missing.join(', ')}.</p>`;
                return;
            }

            const options = list => list.map(i => `<option value="${Number(i.id)}">${esc(i.name)}</option>`).join('');
            fields.innerHTML = `
                <div class="form-group">
                    <label>Nome do Jogo</label>
                    <input type="text" id="gameName" required minlength="3" maxlength="255" placeholder="Ex: Hollow Knight">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="gameStatus" required>
                        <option value="RELEASED">RELEASED</option>
                        <option value="EARLY_ACCESS">EARLY_ACCESS</option>
                        <option value="DEVELOPMENT">DEVELOPMENT</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Desenvolvedor</label>
                    <select id="gameDev" required>${options(devs)}</select>
                </div>
                <div class="form-group">
                    <label>Categoria</label>
                    <select id="gameCategory" required>${options(cats)}</select>
                </div>
                <div class="form-group">
                    <label>Plataformas (segure Ctrl/Cmd)</label>
                    <select id="gamePlatforms" multiple required>${options(plats)}</select>
                </div>`;
        } catch (err) {
            fields.innerHTML = `<p class="state-msg error">Erro ao carregar dependências: ${esc(err.message)}</p>`;
        }
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
    }

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'modalOverlay') closeModal();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    document.getElementById('postForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('formError');
        errorEl.innerText = '';

        let payload;
        if (currentTab === 'game') {
            if (!document.getElementById('gameName')) return; // formulário ainda não carregou
            payload = {
                name: document.getElementById('gameName').value.trim(),
                status: document.getElementById('gameStatus').value,
                developer: { id: Number(document.getElementById('gameDev').value) },
                category: { id: Number(document.getElementById('gameCategory').value) },
                platforms: Array.from(document.getElementById('gamePlatforms').selectedOptions)
                    .map(opt => ({ id: Number(opt.value) }))
            };
        } else {
            payload = { name: document.getElementById('simpleName').value.trim() };
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        try {
            await api(`/${currentTab}`, { method: 'POST', body: JSON.stringify(payload) });
            closeModal();
            currentPage = 0;
            loadCurrentTab();
        } catch (err) {
            errorEl.innerText = `Erro: ${err.message}`;
        } finally {
            submitBtn.disabled = false;
        }
    });

    // ---------- Inicialização ----------

    // Carrega os totais de todas as abas e depois a aba atual
    async function loadCounts() {
        await Promise.all(Object.keys(TABS).map(async (tab) => {
            try {
                const res = await fetch(`${API_BASE_URL}/${tab}?size=1`);
                const data = await res.json();
                if (data.page) document.getElementById(`count-${tab}`).innerText = `[${data.page.totalElements}]`;
            } catch { /* o erro aparece no loadCurrentTab */ }
        }));
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadCounts();
        loadCurrentTab();
    });
</script>
</body>
</html>
